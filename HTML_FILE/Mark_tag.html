<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Highlight and Small Note</title>
</head>
<body>
    <!-- Paragraph containing highlighted word and small note -->
    <h1>Highlight Example</h1>
    <p>
        Learning web development is <mark>fun</mark> and rewarding.
        <br>
        <small>Updated recently</small>
    </p>
</body>
</html>
