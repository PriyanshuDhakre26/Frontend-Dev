<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strong and Emphasis Example</title>
</head>
<body>
    <!-- Paragraph emphasizing different parts using strong and em -->
    <h1>Emphasis Example</h1>
    <p>
        Web development requires <strong>dedication</strong> and a <em>willingness to learn continuously</em> 
        to keep up with new technologies.
    </p>
</body>
</html>
