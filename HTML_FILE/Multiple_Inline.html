<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting Example</title>
</head>
<body>
    <!-- Paragraph demonstrating multiple inline elements -->
    <h1>Inline Formatting</h1>

        Learning web development is <strong>exciting</strong> and <em>challenging</em> at the same time.<br>

    </p>
</body>
