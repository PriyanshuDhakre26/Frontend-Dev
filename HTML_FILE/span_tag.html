<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Elements Example</title>
</head>
<body>
    <!-- Paragraph containing three span elements -->
    <h1>Span Example</h1>
    <p>
        My favorite fruits are 
        <span>Apple</span>, 
        <span>Banana</span>, and 
        <span>Cherry</span>.
    </p>
</body>
</html>
