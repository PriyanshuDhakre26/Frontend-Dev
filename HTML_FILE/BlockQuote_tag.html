<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inspirational Quote</title>
</head>
<body>
    <!-- Displaying a meaningful quote using blockquote and cite -->
    <h1>Inspirational Quote</h1>
    <blockquote>
        "The only way to do great work is to love what you do."
        <br>
        <cite>- Steve Jobs</cite>
    </blockquote>
</body>
</html>
